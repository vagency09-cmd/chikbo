# Nginx site for the Chikbo API at api.chikbo.com (backend only).
# The storefront and admin are deployed separately on web hosting at chikbo.com.
#
#   sudo cp deploy/nginx-api.chikbo.com.conf /etc/nginx/sites-available/api.chikbo.com
#   sudo ln -sf /etc/nginx/sites-available/api.chikbo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.chikbo.com
server {
    listen 80;
    listen [::]:80;
    server_name api.chikbo.com;

    client_max_body_size 110m;   # product videos can be up to 100 MB

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
